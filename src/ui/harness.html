<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuckoo Harness</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<style>
  :root {
    --bg: #1a1a1a;
    --bg-elev: #212121;
    --surface: #262626;
    --surface-hover: #2e2e2e;
    --border: #333333;
    --border-soft: #2a2a2a;
    --text: #ececec;
    --text-2: #b4b4b4;
    --text-dim: #7a7a7a;
    --accent: #d97757;
    --accent-soft: rgba(217,119,87,0.14);
    --green: #7fb069;
    --red: #e06c75;
    --amber: #d9a05b;
    --user-bg: #2b2b2b;
    --mono: "SFMono-Regular", "SF Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
    --sans: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: var(--sans);
    background: var(--bg); color: var(--text);
    overflow: hidden; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 16px;
    background: var(--bg); border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0; user-select: none; -webkit-app-region: drag;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); letter-spacing: .2px; }
  .brand svg { width: 15px; height: 15px; color: var(--accent); }
  .brand-hint { font-size: 10.5px; font-weight: 400; color: var(--amber, #d9a05b); opacity: .85; letter-spacing: 0; }
  .topbar .spacer { flex: 1; }
  .status { font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
  .status.busy { color: var(--amber); }
  .status.busy .dot { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  .status.ready .dot { background: var(--green); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .tb-btn {
    -webkit-app-region: no-drag;
    height: 26px; padding: 0 11px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-2); font-size: 11.5px; cursor: pointer;
    font-family: inherit; transition: all .14s;
  }
  .tb-btn:hover { background: var(--surface); color: var(--text); border-color: var(--border); }
  /* ===== 消息流 ===== */
  .stream { flex: 1; overflow-y: auto; padding: 20px 0 8px; position: relative; }
  .stream::-webkit-scrollbar { width: 9px; }
  .stream::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; border: 2px solid var(--bg); background-clip: padding-box; }
  .stream::-webkit-scrollbar-thumb:hover { background: #4a4a4a; background-clip: padding-box; border: 2px solid var(--bg); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  .empty { text-align: center; color: var(--text-dim); padding: 22vh 20px 0; font-size: 13px; line-height: 1.9; }
  .empty .glyph { margin-bottom: 16px; color: var(--accent); }
  .empty .glyph svg { width: 40px; height: 40px; }
  .empty .t1 { color: var(--text-2); font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .empty .t2 { font-size: 12px; }
  .empty kbd {
    font-family: var(--mono); font-size: 11px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--text-2);
  }

  .msg { margin-bottom: 18px; animation: fade .16s ease; position: relative; }
  @keyframes fade { from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none} }

  /* 悬停显示复制按钮（右上角浮出） */
  .msg .msg-copy {
    position: absolute; top: 0; right: 0;
    display: none; align-items: center; gap: 4px;
    height: 24px; padding: 0 8px; border-radius: 6px;
    background: var(--bg-elev); border: 1px solid var(--border-strong);
    color: var(--text-dim); font-size: 11px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .msg:hover .msg-copy { display: flex; }
  .msg .msg-copy:hover { color: var(--text); background: var(--surface); }
  .msg .msg-copy svg { width: 12px; height: 12px; }
  .msg .msg-copy.copied { color: var(--green); border-color: var(--green); }

  /* 用户消息：右对齐 */
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 80%; background: var(--user-bg); color: var(--text);
    padding: 9px 13px; border-radius: 10px;
    white-space: pre-wrap; word-break: break-word; line-height: 1.6;
    border: 1px solid var(--border-soft);
  }

  /* 助手消息：左对齐，无气泡，前缀标记 */
  .msg.assistant { position: relative; }
  .msg.assistant .prefix {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 600; color: var(--accent);
    letter-spacing: .4px; margin-bottom: 7px;
  }
  .msg.assistant .prefix svg { width: 12px; height: 12px; }
  .msg.assistant .body { line-height: 1.72; color: var(--text); word-break: break-word; }
  .msg.assistant .body p { margin: 0 0 10px; }
  .msg.assistant .body p:last-child { margin-bottom: 0; }
  .msg.assistant .body code {
    background: var(--surface); padding: 1.5px 5px; border-radius: 4px;
    font-family: var(--mono); font-size: 12.5px; color: #e0a58a;
  }
  .msg.assistant .body pre {
    background: #141414; border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 10px 0;
  }
  .msg.assistant .body pre code { background: none; padding: 0; color: var(--text-2); font-size: 12.5px; line-height: 1.62; }
  .msg.assistant .body strong { color: #fff; font-weight: 600; }
  .msg.assistant .body ul { margin: 8px 0; padding-left: 20px; }
  .msg.assistant .body ol { margin: 8px 0; padding-left: 22px; }
  .msg.assistant .body h1, .msg.assistant .body h2, .msg.assistant .body h3,
  .msg.assistant .body h4, .msg.assistant .body h5, .msg.assistant .body h6 {
    margin: 14px 0 8px; font-weight: 600; line-height: 1.4; color: #fff;
  }
  .msg.assistant .body h1 { font-size: 18px; }
  .msg.assistant .body h2 { font-size: 16px; }
  .msg.assistant .body h3 { font-size: 14.5px; }
  .msg.assistant .body h4, .msg.assistant .body h5, .msg.assistant .body h6 { font-size: 13.5px; }
  .msg.assistant .body table {
    border-collapse: collapse; margin: 10px 0; font-size: 12.5px;
    display: block; max-width: 100%; overflow-x: auto;
  }
  .msg.assistant .body th, .msg.assistant .body td {
    border: 1px solid var(--border-soft); padding: 6px 10px; text-align: left;
    white-space: nowrap;
  }
  .msg.assistant .body th { background: var(--surface); font-weight: 600; color: var(--text); }
  .msg.assistant .body blockquote {
    margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--border-strong);
    color: var(--text-2);
  }
  .msg.assistant .body hr { border: none; border-top: 1px solid var(--border-soft); margin: 12px 0; }
  .msg.assistant .body del { color: var(--text-dim); }
  .msg.assistant .body .katex { color: var(--text); font-size: 1.05em; }
  .msg.assistant .body .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
  .msg.assistant .body li { margin: 3px 0; }

  /* 流式光标 */
  .msg.system { display: flex; justify-content: center; }
  .msg.system .sys-text { font-size: 12px; color: var(--amber); padding: 4px 12px; background: rgba(217,160,91,.08); border-radius: 6px; }
  .streaming-cursor {
    display: inline-block; width: 7px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .pending-dots { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
  .pending-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.2s ease-in-out infinite; }
  .pending-dots i:nth-child(2) { animation-delay: .15s; }
  .pending-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  /* 思考过程块 */
  .think {
    margin-bottom: 10px; border-left: 2px solid var(--border);
    background: rgba(255,255,255,0.018); border-radius: 0 6px 6px 0;
  }
  .think-head {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; cursor: pointer; user-select: none;
    font-size: 11.5px; color: var(--text-dim); font-style: italic;
  }
  .think-head:hover { color: var(--text-2); }
  .think-head svg { width: 11px; height: 11px; transition: transform .15s; flex-shrink: 0; }
  .think.open .think-head svg.caret { transform: rotate(90deg); }
  .think-body {
    display: none; padding: 2px 12px 10px 12px;
    font-size: 12.5px; line-height: 1.7; color: var(--text-dim);
    white-space: pre-wrap; word-break: break-word; font-style: italic;
  }
  .think.open .think-body { display: block; }

  /* 工具调用卡片 */
  .tool { margin-bottom: 12px; animation: fade .16s ease; }
  .tool-card { border: 1px solid var(--border-soft); border-radius: 8px; background: var(--bg-elev); overflow: hidden; }
  .tool-head {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 12px; cursor: pointer; user-select: none;
  }
  .tool-head:hover { background: var(--surface); }
  .tool-icon { width: 14px; height: 14px; flex-shrink: 0; color: var(--text-dim); display: flex; }
  .tool-icon svg { width: 14px; height: 14px; }
  .tool-name { font-size: 12px; font-weight: 600; color: var(--text-2); font-family: var(--mono); flex-shrink: 0; }
  .tool-arg { flex: 1; font-size: 12px; color: var(--text-dim); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-badge { font-size: 10px; padding: 1.5px 6px; border-radius: 4px; font-weight: 600; flex-shrink: 0; }
  .tool-badge.run { background: rgba(217,160,91,.16); color: var(--amber); }
  .tool-badge.ok { background: rgba(127,176,105,.16); color: var(--green); }
  .tool-badge.err { background: rgba(224,108,117,.16); color: var(--red); }
  .tool-caret { color: var(--text-dim); flex-shrink: 0; display: flex; }
  .tool-caret svg { width: 9px; height: 9px; transition: transform .15s; }
  .tool-card.open .tool-caret svg { transform: rotate(90deg); }
  .tool-body { display: none; border-top: 1px solid var(--border-soft); }
  .tool-card.open .tool-body { display: block; }
  .tool-sec { padding: 10px 12px; }
  .tool-sec + .tool-sec { border-top: 1px solid var(--border-soft); }
  .tool-sec-label { font-size: 9.5px; font-weight: 600; color: var(--text-dim); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
  .tool-pre {
    background: #141414; border-radius: 6px; padding: 10px 12px; margin: 0;
    overflow: auto; max-height: 340px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    color: var(--text-2); white-space: pre-wrap; word-break: break-word;
  }
  .tool-pre.err { color: #e8a0a6; }

  /* ===== 输入区 ===== */
  .composer { flex-shrink: 0; padding: 10px 24px 20px; }
  .composer-inner {
    max-width: 780px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 10px 10px 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer-inner:focus-within { border-color: #444; box-shadow: 0 0 0 3px rgba(255,255,255,0.03); }
  #input {
    flex: 1; border: none; outline: none; background: transparent; resize: none;
    color: var(--text); font-family: inherit; font-size: 14px; line-height: 1.65;
    max-height: 260px; min-height: 72px; padding: 3px 0;
    scrollbar-width: thin;
  }
  #input::placeholder { color: var(--text-dim); }
  #input::-webkit-scrollbar { width: 8px; }
  #input::-webkit-scrollbar-track { background: transparent; }
  #input::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; border: 2px solid var(--bg-elev); background-clip: padding-box; }
  #input::-webkit-scrollbar-thumb:hover { background: #4a4a4a; background-clip: padding-box; border: 2px solid var(--bg-elev); }
  #send {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .14s, transform .1s, background .14s;
  }
  #send svg { width: 16px; height: 16px; }
  #send:hover { opacity: .88; }
  #send:active { transform: scale(.93); }
  #send:disabled { opacity: .35; cursor: default; }
  #send.stop { background: var(--red); }
  #send.stop:hover { opacity: 1; }
  .composer-hint { max-width: 780px; margin: 7px auto 0; font-size: 10.5px; color: var(--text-dim); text-align: center; }

  /* 待发指令 chips（技能/工具/计划等，不进对话气泡） */
  .hint-row { max-width: 780px; margin: 0 auto 6px; display: flex; flex-wrap: wrap; gap: 7px; }
  .hint-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent-soft, rgba(217,119,87,.14)); border: 1px solid var(--border);
    border-radius: 7px; padding: 4px 7px 4px 9px; font-size: 11.5px; color: var(--accent);
  }
  .hint-chip .hc-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .hint-chip .hc-del { width: 15px; height: 15px; border: none; background: transparent; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 4px; opacity: .7; }
  .hint-chip .hc-del:hover { opacity: 1; background: rgba(255,255,255,.08); }
  .hint-chip .hc-del svg { width: 9px; height: 9px; }

  /* 附件区 */
  .attach-row { max-width: 780px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 7px; }
  .attach-chip {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px 5px 9px; font-size: 12px; max-width: 240px;
  }
  .attach-chip .ac-icon { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; display: flex; }
  .attach-chip .ac-icon svg { width: 15px; height: 15px; }
  .attach-chip .ac-name { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attach-chip .ac-size { color: var(--text-dim); font-size: 10.5px; flex-shrink: 0; }
  .attach-chip .ac-del { width: 16px; height: 16px; border: none; background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; border-radius: 4px; }
  .attach-chip .ac-del:hover { background: var(--surface-hover); color: var(--text); }
  .attach-chip .ac-del svg { width: 10px; height: 10px; }
  .attach-btn {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .14s;
  }
  .attach-btn:hover { background: var(--surface); color: var(--text); }
  .attach-btn svg { width: 17px; height: 17px; }
  .drop-overlay {
    position: absolute; inset: 0; z-index: 50; border: 2px dashed var(--accent);
    border-radius: 12px; background: rgba(217,119,87,.08);
    display: none; align-items: center; justify-content: center;
    color: var(--accent); font-size: 13px; font-weight: 600; pointer-events: none;
  }
  .drop-overlay.show { display: flex; }

  /* 滚动到底部按钮（紧贴输入框顶部居中悬浮）*/
  .scroll-bottom {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(100% + 8px); z-index: 20;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--bg-elev); border: 1px solid var(--border-strong);
    color: var(--text); cursor: pointer;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    transition: opacity .15s, transform .15s, background .15s;
  }
  .scroll-bottom.show { display: flex; }
  .scroll-bottom:hover { background: var(--surface); }
  .scroll-bottom:active { transform: translateX(-50%) scale(.92); }
  .scroll-bottom svg { width: 16px; height: 16px; }
  .composer { position: relative; }

  /* 斜杠菜单（技能/工具） */
  .slash-menu {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
    max-height: 300px; overflow-y: auto;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.45);
    display: none; z-index: 30; padding: 5px;
  }
  .slash-menu.show { display: block; }
  .slash-sec { font-size: 9.5px; font-weight: 600; color: var(--text-dim); letter-spacing: .6px; text-transform: uppercase; padding: 7px 9px 4px; }
  /* 条目版式对齐 DSH：图标 · 中文名 · 英文标识 · 右侧说明 */
  .slash-item {
    display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 7px;
    cursor: pointer; font-size: 12.5px;
  }
  .slash-item:hover, .slash-item.active { background: var(--surface); }
  .slash-item .si-icon { width: 15px; height: 15px; flex-shrink: 0; color: var(--text-dim); display: flex; }
  .slash-item .si-icon svg { width: 15px; height: 15px; }
  .slash-item.active .si-icon, .slash-item:hover .si-icon { color: var(--text-2); }
  .slash-item .si-name { color: var(--text); font-weight: 600; flex-shrink: 0; }
  .slash-item .si-name.si-code { font-family: var(--mono); font-size: 12px; font-weight: 500; }
  .slash-item .si-alias { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); flex-shrink: 0; }
  .slash-item .si-desc {
    margin-left: auto; padding-left: 12px; min-width: 0;
    color: var(--text-dim); font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .composer-inner { position: relative; }

  /* ===== Goal 目标条 ===== */
  .goalbar {
    display: none; align-items: center; gap: 10px;
    padding: 7px 16px; flex-shrink: 0;
    background: var(--bg-elev); border-bottom: 1px solid var(--border-soft);
  }
  .goalbar.show { display: flex; }
  .goalbar .g-icon { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; display: flex; }
  .goalbar .g-icon svg { width: 15px; height: 15px; }
  .goalbar .g-main { flex: 1; min-width: 0; }
  /* 目标文本：本身就是可编辑输入框（就地改目标，不弹窗） */
  .goalbar .g-text {
    display: block; width: 100%; min-width: 0;
    margin: -1px 0 -1px -5px; padding: 1px 4px;
    background: transparent; border: 1px solid transparent; border-radius: 5px;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text);
    outline: none; text-overflow: ellipsis; cursor: text;
  }
  .goalbar .g-text:hover { border-color: var(--border); }
  .goalbar .g-text:focus { border-color: var(--accent); background: var(--bg); }
  .goalbar .g-text[readonly] { cursor: default; }
  .goalbar .g-text[readonly]:hover { border-color: transparent; }
  .goalbar .g-text::placeholder { color: var(--text-dim); font-weight: 400; }
  .goalbar.done .g-text, .goalbar.paused .g-text { color: var(--text-2); }
  .goalbar .g-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; display: flex; align-items: center; gap: 7px; }
  .goalbar .g-state { display: inline-flex; align-items: center; gap: 5px; }
  .goalbar .g-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
  .goalbar.running .g-state { color: var(--amber); }
  .goalbar.running .g-state i { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  .goalbar.done .g-state { color: var(--green); }
  .goalbar.done .g-state i { background: var(--green); }
  .goalbar .g-btn {
    height: 24px; padding: 0 10px; border-radius: 6px; flex-shrink: 0;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-2); font-size: 11px; cursor: pointer;
    font-family: inherit; transition: all .14s;
  }
  .goalbar .g-btn:hover { background: var(--surface); color: var(--text); }
  .goalbar .g-btn.danger:hover { color: var(--red); border-color: rgba(224,108,117,.5); }
  .goalbar .g-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* ===== Plan 计划面板 ===== */
  .plan-panel { display: none; flex-shrink: 0; background: var(--bg-elev); border-bottom: 1px solid var(--border-soft); }
  .plan-panel.show { display: block; }
  .plan-head { display: flex; align-items: center; gap: 8px; padding: 6px 16px; cursor: pointer; user-select: none; }
  .plan-head:hover { background: var(--surface); }
  .plan-head .caret { width: 9px; height: 9px; color: var(--text-dim); transition: transform .15s; flex-shrink: 0; }
  .plan-panel.open .plan-head .caret { transform: rotate(90deg); }
  .plan-head .p-icon { width: 13px; height: 13px; color: var(--text-2); flex-shrink: 0; display: flex; }
  .plan-head .p-icon svg { width: 13px; height: 13px; }
  .plan-head .p-title { font-size: 11.5px; font-weight: 600; color: var(--text-2); letter-spacing: .4px; }
  .plan-head .p-count { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .plan-head .p-bar { flex: 1; max-width: 140px; height: 3px; border-radius: 2px; background: var(--surface); overflow: hidden; margin-left: 8px; }
  .plan-head .p-bar-fill { height: 100%; width: 0; background: var(--green); transition: width .3s; }
  .plan-body { display: none; max-height: 220px; overflow-y: auto; padding: 2px 16px 10px; }
  .plan-panel.open .plan-body { display: block; }
  .plan-body::-webkit-scrollbar { width: 8px; }
  .plan-body::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
  .plan-item { display: flex; align-items: flex-start; gap: 9px; padding: 3.5px 0; font-size: 12.5px; color: var(--text-2); line-height: 1.55; }
  .plan-item .pi-state { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
  .plan-item .pi-state svg { width: 14px; height: 14px; }
  .plan-item .pi-state.st-in_progress { color: var(--amber); }
  .plan-item .pi-state.st-in_progress svg { animation: pulse 1.2s ease-in-out infinite; }
  .plan-item .pi-state.st-completed { color: var(--green); }
  .plan-item.completed { color: var(--text-dim); }
  .plan-item.completed .pi-text { text-decoration: line-through; }
  .plan-item.in_progress { color: var(--text); }

  /* 进行中顶部进度条 */
  .progress {
    position: absolute; top: 0; left: 0; height: 2px; width: 0;
    background: var(--accent); opacity: 0; transition: opacity .2s;
  }
  .progress.on { opacity: 1; animation: indeterminate 1.4s ease-in-out infinite; }
  @keyframes indeterminate {
    0% { left: 0; width: 0; }
    50% { left: 30%; width: 45%; }
    100% { left: 100%; width: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 5v13a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V5M9 9l3 3M15 9l-3 3"/></svg>
      Cuckoo Harness
      <span class="brand-hint">（当前版本仅支持单对话，请勿在运行过程切换对话）</span>
    </div>
    <div class="spacer"></div>
    <div class="status ready" id="status"><span class="dot"></span><span id="status-text">就绪</span></div>
    <button class="tb-btn" id="btn-web" title="返回网页模式 (Ctrl+Shift+H)">网页模式</button>
  </div>
  <div class="goalbar" id="goalbar">
    <span class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></span>
    <div class="g-main">
      <input class="g-text" id="goal-text" type="text" spellcheck="false" placeholder="目标（点击可直接编辑）" />
      <div class="g-meta"><span class="g-state" id="goal-state"><i></i><span id="goal-state-text">进行中</span></span><span>·</span><span id="goal-round"></span></div>
    </div>
    <div class="g-actions">
      <button class="g-btn" id="goal-toggle">暂停</button>
      <button class="g-btn danger" id="goal-cancel">退出</button>
    </div>
  </div>
  <div class="plan-panel" id="plan-panel">
    <div class="plan-head" id="plan-head">
      <svg class="caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
      <span class="p-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h10M3 8h10M3 12h6"/></svg></span>
      <span class="p-title">计划</span>
      <span class="p-count" id="plan-count">0/0</span>
      <div class="p-bar"><div class="p-bar-fill" id="plan-bar-fill"></div></div>
    </div>
    <div class="plan-body" id="plan-body"></div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="stream" id="stream">
    <div class="empty" id="empty">
      <div class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <div class="t1">纯净对话模式</div>
      <div class="t2">只显示你与模型的对话、思考过程与工具调用</div>
      <div class="t2" style="margin-top:10px">AI 网页在后台运行 · 按 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd> 切回</div>
      <div class="t2" style="margin-top:4px">输入 <kbd>/goal</kbd> + 目标描述，开启自动多轮推进</div>
      <div class="t2" style="margin-top:4px">斜杠菜单里显示的是中文名与英文标识（如 目标 goal），也可直接手输 <kbd>/goal</kbd> / <kbd>/plan</kbd></div>
    </div>
  </div>
  <div class="composer">
    <div class="hint-row" id="hint-row"></div>
    <div class="attach-row" id="attach-row"></div>
    <div class="composer-inner">
      <button class="scroll-bottom" id="scroll-bottom" title="回到底部"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10M8 13l-4-4M8 13l4-4"/></svg></button>
      <div class="slash-menu" id="slash-menu"></div>
      <button class="attach-btn" id="attach-btn" title="添加附件（图片/文件）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4.5l-5 5a2 2 0 0 0 2.8 2.8l5-5a3.5 3.5 0 0 0-5-5l-4.5 4.5a5 5 0 0 0 7 7l4-4"/></svg></button>
      <textarea id="input" rows="3" placeholder="输入消息…  / 查看技能与工具"></textarea>
      <button id="send" title="发送"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M8 3l-4 4M8 3l4 4"/></svg></button>
      <input type="file" id="file-input" multiple style="display:none" />
    </div>
    <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · / 技能工具（↑↓ 选择） · /goal 目标 自动多轮推进 · 可粘贴/拖拽图片</div>
    <div class="drop-overlay" id="drop-overlay">松开以添加文件</div>
  </div>
</div>
<script>
(function () {
  var api = window.harnessAPI || {};
  var stream = document.getElementById('stream');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var btnWeb = document.getElementById('btn-web');

  var BT = String.fromCharCode(96);
  var FENCE = BT + BT + BT;
  var toolSeq = 0;
  // 当前流式中的助手消息节点
  var cur = null;

  // ===== 对话历史持久化（localStorage，刷新/重开不丢）=====
  var HIST_BASE = 'cuckoo-harness-history-v1';
  var currentSessionId = '';
  var history = [];
  function histKeyOf(sid) { return HIST_BASE + (sid ? ':' + sid : ''); }
  function histKey() { return histKeyOf(currentSessionId); }
  function loadHist() {
    try {
      var raw = localStorage.getItem(histKey());
      if (raw == null && currentSessionId) {
        // 回退：把旧的"全局历史"（无后缀 key）迁移到当前会话
        var legacy = localStorage.getItem(HIST_BASE);
        if (legacy != null) { raw = legacy; try { localStorage.setItem(histKey(), legacy); } catch (e) { /* ignore */ } }
      }
      history = JSON.parse(raw || '[]') || [];
    } catch (e) { history = []; }
  }
  // 单条字段截断上限（防止超大工具输出撑爆 localStorage）
  var HIST_FIELD_MAX = 6000;
  function truncHist(s) {
    s = String(s == null ? '' : s);
    return s.length > HIST_FIELD_MAX ? s.slice(0, HIST_FIELD_MAX) + '\n…[历史记录已截断]' : s;
  }
  function compactHist() {
    for (var i = 0; i < history.length; i++) {
      var e = history[i];
      if (e.text) e.text = truncHist(e.text);
      if (e.output) e.output = truncHist(e.output);
      if (e.error) e.error = truncHist(e.error);
      if (e.think) e.think = truncHist(e.think);
      if (e.code) e.code = truncHist(e.code);
    }
  }
  function saveHist() {
    try {
      if (history.length > 400) history = history.slice(-400);
      compactHist();
      try {
        localStorage.setItem(histKey(), JSON.stringify(history));
      } catch (e) {
        // 配额溢出：丢弃最旧的一半后重试，最多重试 5 次
        var tries = 0;
        while (tries < 5) {
          tries++;
          history = history.slice(Math.ceil(history.length / 2));
          try { localStorage.setItem(histKey(), JSON.stringify(history)); break; }
          catch (e2) { /* continue */ }
        }
      }
    } catch (e) { /* ignore */ }
  }
  function pushHist(e) {
    // 入库前先截断大字段
    if (e) {
      if (e.text) e.text = truncHist(e.text);
      if (e.output) e.output = truncHist(e.output);
      if (e.error) e.error = truncHist(e.error);
      if (e.think) e.think = truncHist(e.think);
      if (e.code) e.code = truncHist(e.code);
    }
    history.push(e);
    saveHist();
  }
  // 静态渲染助手消息（历史恢复专用，不走去重/流式逻辑，避免丢消息）
  function renderAssistantStatic(text, think) {
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg assistant';
    var thinkHtml = '';
    if (think && think.trim()) {
      thinkHtml = '<div class="think"><div class="think-head"><svg class="caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg><span class="think-label">已思考 (' + think.length + ' 字)</span></div><div class="think-body">' + esc(think) + '</div></div>';
    }
    d.innerHTML = '<div class="prefix">' + PREFIX_SVG + 'Cuckoo</div>' + thinkHtml + '<div class="body">' + renderMarkdown(text) + '</div>';
    var thinkEl = d.querySelector('.think');
    if (thinkEl) {
      thinkEl.querySelector('.think-head').addEventListener('click', function () { thinkEl.classList.toggle('open'); });
    }
    attachCopy(d, function () { return (d.querySelector('.body') || {}).innerText || ''; });
    stream.appendChild(d);
  }

  function restoreHist() {
    if (!history.length) return;
    clearEmpty();
    var pendingTools = [];
    function flushTools() {
      for (var k = 0; k < pendingTools.length; k++) {
        try {
          var t = pendingTools[k];
          addToolStart(t.code);
          if (t.success !== null && t.success !== undefined) addToolEnd(t.success, t.output, t.error);
        } catch (err) { /* 单条工具恢复失败，跳过 */ }
      }
      pendingTools = [];
    }
    for (var i = 0; i < history.length; i++) {
      // 单条渲染失败不能中断整个恢复（否则其后"最近"的条目全丢）
      try {
        var e = history[i];
        if (e.t === 'tool') { pendingTools.push(e); continue; }
        flushTools();
        if (e.t === 'user') addUser(e.text);
        else if (e.t === 'assistant') renderAssistantStatic(e.text, e.think);
        else if (e.t === 'system') appendSystem(e.text);
        else if (e.t === 'plan') renderPlan(e.todos, false);
      } catch (err) {
        try { console.warn('[harness] 历史条目恢复失败:', err && err.message); } catch (_) {}
      }
    }
    try { flushTools(); } catch (err) { try { console.warn('[harness] 历史工具恢复失败:', err && err.message); } catch (_) {} }
    stream.scrollTop = stream.scrollHeight;
    updateScrollBtn();
  }
  function clearHist() {
    history = [];
    saveHist();
    stream.innerHTML = '';
    cur = null;
  }

  // 会话切换：保存旧会话历史，加载新会话历史 + 切换该会话的 goal/plan
  function onSessionChanged(sid) {
    sid = sid || '';
    if (sid === currentSessionId) return;
    // 存旧会话的 history + goal
    try { localStorage.setItem(histKeyOf(currentSessionId), JSON.stringify(history)); } catch (e) { /* ignore */ }
    try { localStorage.setItem(goalKeyOf(currentSessionId), goal ? JSON.stringify(goal) : 'null'); } catch (e) { /* ignore */ }
    currentSessionId = sid;
    loadHist();
    loadGoalState();       // 载入新会话的 goal
    renderGoalBar();
    renderPlan(planBySession[sid] || []);  // 载入新会话的 plan
    cancelGoalNudge();
    cur = null;
    stream.innerHTML = '';
    if (!history.length) { showEmptyState(); return; }
    restoreHist();
    scrollBottom(true);
  }

  // 恢复空态占位
  var EMPTY_HTML = null;
  function showEmptyState() {
    if (EMPTY_HTML == null) return;
    stream.innerHTML = EMPTY_HTML;
    empty = document.getElementById('empty');
  }

  // ===== Goal（目标）/ Plan（计划）=====
  var GOAL_KEY = 'cuckoo-harness-goal-v1';
  // 目标自动推进：不限轮次，直到 AI 声明完成或用户手动停止
  var GOAL_NUDGE_DELAY = 3000;   // 纯文本回复后等待 ms；期间出现工具调用/新流式则取消催促
  var goal = null;               // { text, round, done }
  var goalNudgeTimer = null;
  var toolRunningCount = 0;
  // 计划按会话缓存（sessionId → todos）
  var planBySession = {};
  // 计划驱动状态（按会话）
  var planRoundBySession = {};       // sessionId -> 自动续跑轮数
  var planLastTextBySession = {};    // sessionId -> 上轮文本（无进展检测）
  var planNoProgressBySession = {};  // sessionId -> 连续无进展次数
  /** 计划自动推进开关（默认开） */
  function planAutoEnabled() {
    try { var v = localStorage.getItem('cuckoo-plan-auto'); return v === null ? true : v === '1'; } catch (e) { return true; }
  }
  function planTodos() { return planBySession[currentSessionId] || []; }
  /** 计划是否有未完成步骤（pending / in_progress） */
  function planHasPending() {
    var todos = planTodos();
    for (var i = 0; i < todos.length; i++) {
      var st = String(todos[i].status || 'pending').toLowerCase();
      if (st === 'completed' || st === 'done' || st === 'complete' || st === 'finished') continue;
      return true;
    }
    return false;
  }

  var goalbar = document.getElementById('goalbar');
  var goalTextEl = document.getElementById('goal-text');
  var goalStateTextEl = document.getElementById('goal-state-text');
  var goalRoundEl = document.getElementById('goal-round');

  function goalKeyOf(sid) { return GOAL_KEY + (sid ? ':' + sid : ''); }
  function goalKey() { return goalKeyOf(currentSessionId); }
  function saveGoalState() {
    try { localStorage.setItem(goalKey(), goal ? JSON.stringify(goal) : 'null'); } catch (e) { /* ignore */ }
  }
  function loadGoalState() {
    try { goal = JSON.parse(localStorage.getItem(goalKey()) || 'null'); } catch (e) { goal = null; }
    if (goal && (!goal.text)) goal = null;
    // 兼容旧存档（无计时字段）：运行中的目标续上进度表
    if (goal) {
      if (typeof goal.elapsed !== 'number') goal.elapsed = 0;
      if (!goal.done && !goal.paused && !goal.startedAt) goal.startedAt = Date.now();
    }
  }

  // 目标条内的"目标描述"就是编辑框：去掉可能残留的 [目标]/[计划] 展示标签
  function stripGoalLabel(s) {
    return String(s == null ? '' : s).replace(/^\[(?:目标|计划)\]\s*/, '');
  }

  /** 计时：paused/done 时冻结在 goal.elapsed，running 时叠加 startedAt 至今 */
  function goalElapsedMs() {
    if (!goal) return 0;
    return (goal.elapsed || 0) + (goal.startedAt ? (Date.now() - goal.startedAt) : 0);
  }
  function fmtElapsed(ms) {
    var s = Math.max(0, Math.floor((ms || 0) / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return h > 0 ? (h + ':' + p(m) + ':' + p(ss)) : (m + ':' + p(ss));
  }
  var goalTickTimer = null;
  function startGoalTick() {
    if (goalTickTimer) return;
    goalTickTimer = setInterval(renderGoalMeta, 1000);
  }
  function stopGoalTick() {
    if (goalTickTimer) { clearInterval(goalTickTimer); goalTickTimer = null; }
  }
  /** 只刷新状态灯 / 轮数 / 计时（不动编辑框，避免抢用户光标） */
  function renderGoalMeta() {
    if (!goal) return;
    goalStateTextEl.textContent = goal.done ? '已完成' : (goal.paused ? '已暂停' : '进行中');
    goalRoundEl.textContent = '迭代 ' + goal.round + (goal.maxIterations ? ' / ' + goal.maxIterations : '') + ' · ' + fmtElapsed(goalElapsedMs());
  }

  function renderGoalBar() {
    if (!goalbar) return;
    if (!goal) { goalbar.classList.remove('show'); stopGoalTick(); return; }
    goalbar.className = 'goalbar show ' + (goal.done ? 'done' : (goal.paused ? 'paused' : 'running'));
    if (goalTextEl) {
      // 用户正在编辑时不覆盖输入内容
      if (document.activeElement !== goalTextEl) goalTextEl.value = stripGoalLabel(goal.text) || goal.text;
      goalTextEl.readOnly = !!goal.done;
      goalTextEl.title = goal.text;
    }
    renderGoalMeta();
    var tg = document.getElementById('goal-toggle');
    if (tg) { tg.textContent = goal.done ? '完成' : (goal.paused ? '继续' : '暂停'); tg.style.display = goal.done ? 'none' : ''; }
    var cc = document.getElementById('goal-cancel');
    if (cc) cc.textContent = goal.done ? '清除' : '退出';
    if (goal.done || goal.paused) stopGoalTick(); else startGoalTick();
  }

  /** 读最大迭代次数（设置项，默认 50） */
  function goalMaxIterations() {
    try {
      var v = parseInt(localStorage.getItem('cuckoo-goal-max-iterations') || '', 10);
      if (Number.isFinite(v) && v > 0) return v;
    } catch (e) { /* ignore */ }
    return 50;
  }

  // 构造目标推进指令（发给 AI 的完整文本）
  function buildGoalSendText(gt) {
    return '【目标】' + gt + '\n\n请持续推进并完成上述目标，要求：\n' +
      '1. 优先使用可用工具实际推进（读写文件、执行命令、检索等），而非只输出计划；\n' +
      '2. 一轮无法完成时直接继续下一轮，无需等待用户确认；\n' +
      '3. 目标完成时，在回复末尾单独一行输出 [[GOAL_DONE]]（界面上不会显示这行标记）；\n' +
      '4. 遇到无法解决的阻碍时，说明原因并暂停等待。';
  }

  function startGoal(text) {
    cancelGoalNudge();
    goal = { text: text, round: 0, done: false, paused: false, maxIterations: goalMaxIterations(), lastText: '', startedAt: Date.now(), elapsed: 0 };
    goalNoProgress = 0;
    saveGoalState();
    renderGoalBar();
    appendSystem('目标已设定（自动迭代，最多 ' + goal.maxIterations + ' 轮；完成后 AI 会自行收尾）');
    pushHist({ t: 'system', text: '目标已设定：' + text });
  }

  function stopGoal(reason) {
    cancelGoalNudge();
    stopGoalTick();
    if (reason) {
      appendSystem(reason);
      pushHist({ t: 'system', text: reason });
    }
    goal = null;
    saveGoalState();
    renderGoalBar();
  }

  /**
   * 退出目标 = 立刻停手：中止当前生成/工具循环 + 清掉待发的自动续跑。
   * 与"暂停"同样的语义（用户要的是立即中止），只是额外清除目标本身。
   */
  function exitGoal() {
    var reason = '已退出目标，当前任务已中止';
    cancelGoalNudge();
    markAborted();
    clearPendingBubble();
    setStatus('就绪', 'ready');
    stopGoal(reason);
    if (api.stop) { try { api.stop().catch(function () { /* ignore */ }); } catch (e) { /* ignore */ } }
  }

  /** 收尾当前助手气泡：只剩加载动画 → 整块移除；否则只摘掉流式光标 */
  function clearPendingBubble() {
    if (!cur) return;
    var isEmptyPending = cur.pending && cur.body && cur.body.querySelector('.pending-dots');
    if (isEmptyPending) {
      if (cur.el && cur.el.parentNode) cur.el.parentNode.removeChild(cur.el);
    } else if (cur.body) {
      var cursor = cur.body.querySelector('.streaming-cursor');
      if (cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
    }
    cur = null;
  }

  function cancelGoalNudge() {
    if (goalNudgeTimer) { clearTimeout(goalNudgeTimer); goalNudgeTimer = null; }
  }

  /** goal 无进展检测：连续多轮输出相同 → 停（防死循环烧 token） */
  var goalNoProgress = 0;
  function checkProgress(text) {
    if (!goal) return;
    var t = String(text || '').trim();
    if (t && t === goal.lastText) goalNoProgress++;
    else goalNoProgress = 0;
    goal.lastText = t;
  }

  /** 计划无进展检测：连续多轮输出相同 → 停 */
  function checkPlanProgress(text) {
    var sid = currentSessionId;
    var t = String(text || '').trim();
    if (t && t === planLastTextBySession[sid]) planNoProgressBySession[sid] = (planNoProgressBySession[sid] || 0) + 1;
    else planNoProgressBySession[sid] = 0;
    planLastTextBySession[sid] = t;
  }
  /** 计划轮数重置（新任务/新计划时） */
  function resetPlanDrive() {
    var sid = currentSessionId;
    planRoundBySession[sid] = 0;
    planLastTextBySession[sid] = '';
    planNoProgressBySession[sid] = 0;
  }

  /**
   * 纯文本回合结束 → 延迟自动续跑。
   * goal 优先；否则若 plan 有未完成步骤（默认开）则按 plan 驱动。
   * 两者共用：最大迭代 + 无进展检测。
   */
  function scheduleGoalNudge() {
    var goalActive = !!(goal && !goal.done && !goal.paused);
    var planActive = !goalActive && planAutoEnabled() && planHasPending();
    if (!goalActive && !planActive) return;
    cancelGoalNudge();
    goalNudgeTimer = setTimeout(function () {
      goalNudgeTimer = null;
      if (isBusy()) return;
      var gOn = !!(goal && !goal.done && !goal.paused);
      var pOn = !gOn && planAutoEnabled() && planHasPending();
      if (!gOn && !pOn) return;
      clearAbortSuppression();
      if (gOn) {
        // ---- goal 驱动 ----
        if (goal.maxIterations && goal.round >= goal.maxIterations) {
          goal.done = true; saveGoalState(); renderGoalBar();
          appendSystem('目标已达最大迭代次数（' + goal.maxIterations + ' 轮），停止');
          pushHist({ t: 'system', text: '目标达最大迭代次数，停止' });
          return;
        }
        if (goalNoProgress >= 3) {
          goal.done = true; saveGoalState(); renderGoalBar();
          appendSystem('目标连续多轮无进展，停止');
          pushHist({ t: 'system', text: '目标无进展，停止' });
          return;
        }
        goal.round++;
        saveGoalState();
        renderGoalBar();
      } else {
        // ---- plan 驱动 ----
        var sid = currentSessionId;
        var max = goalMaxIterations();
        var round = planRoundBySession[sid] || 0;
        if (max && round >= max) {
          appendSystem('计划已达最大迭代次数（' + max + ' 轮），停止');
          pushHist({ t: 'system', text: '计划达最大迭代次数，停止' });
          return;
        }
        if ((planNoProgressBySession[sid] || 0) >= 3) {
          appendSystem('计划连续多轮无进展，停止');
          pushHist({ t: 'system', text: '计划无进展，停止' });
          return;
        }
        planRoundBySession[sid] = round + 1;
      }
      setStatus('生成中…', 'busy');
      if (!cur) cur = createAssistant();
      if (api.sendMessage) api.sendMessage(nudgeSendText(gOn));
    }, GOAL_NUDGE_DELAY);
  }

  /** 自动续跑时发给 AI 的文本（goal / plan 两种语义） */
  function nudgeSendText(goalMode) {
    if (goalMode) return '继续推进当前目标。若目标已全部完成，请直接回复：目标已完成。';
    return '继续执行计划中尚未完成的步骤，并用 todoWrite 更新进度。若计划已全部完成，请把所有步骤标记为 completed。';
  }

  function onGoalDone() {
    cancelGoalNudge();
    if (goal && !goal.done) {
      goal.done = true;
      goal.elapsed = goalElapsedMs();
      goal.startedAt = 0;
      saveGoalState();
      renderGoalBar();
      appendSystem('目标已完成');
      pushHist({ t: 'system', text: '目标已完成' });
    }
  }

  /** 就地改目标：沿用已跑轮数/已用时间，不重置进度，也不额外催一轮 */
  function setGoalText(text) {
    var t = String(text == null ? '' : text).trim();
    if (!goal || goal.done) return;
    if (!t || t === goal.text) { renderGoalBar(); return; }
    goal.text = t;
    goal.lastText = '';
    goalNoProgress = 0;
    saveGoalState();
    renderGoalBar();
    appendSystem('目标已修改：' + t);
    pushHist({ t: 'system', text: '目标已修改：' + t });
  }

  // 目标文本就地编辑（Enter 提交 / Esc 撤销 / 失焦提交）
  var goalInput = document.getElementById('goal-text');
  if (goalInput) {
    goalInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); setGoalText(goalInput.value); goalInput.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); if (goal) goalInput.value = stripGoalLabel(goal.text) || goal.text; goalInput.blur(); }
      e.stopPropagation();

    goalInput.addEventListener('blur', function () { setGoalText(goalInput.value); });
  }

  // 暂停/继续：暂停 = 立即中止当前任务（与 DSH 一致），继续 = 立刻接着推进
  var goalToggleBtn = document.getElementById('goal-toggle');
  if (goalToggleBtn) goalToggleBtn.addEventListener('click', function () {
    if (!goal || goal.done) return;
    goal.paused = !goal.paused;
    if (goal.paused) {
      // 记录已用时间并停表
      goal.elapsed = goalElapsedMs();
      goal.startedAt = 0;
      cancelGoalNudge();
      markAborted();
      setStatus('就绪', 'ready');
      appendSystem('目标已暂停，当前任务已中止');
      pushHist({ t: 'system', text: '目标已暂停，当前任务已中止' });
      if (api.stop) { try { api.stop().catch(function () { /* ignore */ }); } catch (e) { /* ignore */ } }
    } else {
      goal.startedAt = Date.now();
      appendSystem('目标已继续');
      pushHist({ t: 'system', text: '目标已继续' });
      scheduleGoalNudge();
    }
    saveGoalState(); renderGoalBar();
  });
  // 退出/清除
  var goalCancelBtn = document.getElementById('goal-cancel');
  if (goalCancelBtn) goalCancelBtn.addEventListener('click', function () {
    if (goal && goal.done) stopGoal('');
    else exitGoal();
  });

  // ----- Plan（计划，数据来自官方 todoWrite 工具） -----
  var planPanel = document.getElementById('plan-panel');
  var planBodyEl = document.getElementById('plan-body');
  var planCountEl = document.getElementById('plan-count');
  var planBarFillEl = document.getElementById('plan-bar-fill');

  var PLAN_ICON = {
    pending: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/></svg>',
    in_progress: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2.4" fill="currentColor" stroke="none"/></svg>',
    completed: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.3"/><path d="M5.3 8.3l1.8 1.8 3.6-4"/></svg>'
  };

  function renderPlan(todos, expand) {
    if (!planPanel) return;
    todos = todos || [];
    if (!todos.length) { planPanel.classList.remove('show'); return; }
    var wasShown = planPanel.classList.contains('show');
    planPanel.classList.add('show');
    var done = 0, html = '';
    for (var i = 0; i < todos.length; i++) {
      var st = String(todos[i].status || 'pending').toLowerCase();
      if (st === 'done' || st === 'complete' || st === 'finished') st = 'completed';
      if (st === 'doing' || st === 'active' || st === 'inprogress') st = 'in_progress';
      if (st === 'completed') done++;
      var cls = st === 'in_progress' ? 'in_progress' : (st === 'completed' ? 'completed' : '');
      html += '<div class="plan-item ' + cls + '">' +
        '<span class="pi-state st-' + st + '">' + (PLAN_ICON[st] || PLAN_ICON.pending) + '</span>' +
        '<span class="pi-text">' + esc(todos[i].content || '') + '</span></div>';
    }
    planBodyEl.innerHTML = html;
    planCountEl.textContent = done + '/' + todos.length;
    planBarFillEl.style.width = Math.round(done / todos.length * 100) + '%';
    // 首次出现自动展开；之后保留用户的手动开合状态
    if (expand !== false && (!wasShown || planPanel.classList.contains('open'))) planPanel.classList.add('open');
  }

  if (planPanel) {
    document.getElementById('plan-head').addEventListener('click', function () { planPanel.classList.toggle('open'); });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMarkdown(text) {
    var src = String(text == null ? '' : text);
    var blocks = [];
    var reFence = new RegExp(FENCE + '([\w-]*)\n?([\s\S]*?)' + FENCE, 'g');
    src = src.replace(reFence, function (m, lang, code) {
      blocks.push('<pre><code>' + esc(code) + '</code></pre>');
      return '@@BLOCK' + (blocks.length - 1) + '@@';
    });
    // 提取数学（$$...$$ 块级、$...$ 行内），用 KaTeX 渲染，避免被后续 markdown 处理破坏
    var maths = [];
    function renderMath(tex, display) {
      try {
        if (typeof window.katex !== 'undefined' && window.katex.renderToString) {
          return window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
        }
      } catch (e) { /* ignore */ }
      return '<code>' + esc((display ? '$$' : '$') + tex + (display ? '$$' : '$')) + '</code>';
    }
    src = src.replace(/\$\$([\s\S]+?)\$\$/g, function (m, tex) {
      maths.push(renderMath(tex.trim(), true));
      return '@@MATH' + (maths.length - 1) + '@@';
    });
    src = src.replace(/\$([^\$\n]+?)\$/g, function (m, tex) {
      maths.push(renderMath(tex.trim(), false));
      return '@@MATH' + (maths.length - 1) + '@@';
    });
    src = esc(src);
    var reInline = new RegExp(BT + '([^' + BT + '\n]+)' + BT, 'g');
    src = src.replace(reInline, '<code>$1</code>');
    src = src.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    src = src.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    // 行级块解析：表格 / 标题 / 分割线 / 引用 / 有序/无序列表 / 段落
    var lines = src.split('\n');
    var out = [];
    function isTableSep(s) { return /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(s); }
    function splitRow(s) {
      s = s.trim();
      if (s.charAt(0) === '|') s = s.slice(1);
      if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
      return s.split('|').map(function (c) { return c.trim(); });
    }
    var bi = 0, paraBuf = [];
    function flushPara() { if (paraBuf.length) { out.push('<p>' + paraBuf.join('<br>') + '</p>'); paraBuf = []; } }
    while (bi < lines.length) {
      var line = lines[bi], t = line.trim();
      if (t.indexOf('|') >= 0 && bi + 1 < lines.length && isTableSep(lines[bi + 1])) {
        flushPara();
        var head = splitRow(t); bi += 2; var rows = [];
        while (bi < lines.length && lines[bi].trim() !== '' && lines[bi].indexOf('|') >= 0) { rows.push(splitRow(lines[bi])); bi++; }
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
        continue;
      }
      var hm = /^(#{1,6})\s+(.*)$/.exec(t);
      if (hm) { flushPara(); var lv = hm[1].length; out.push('<h' + lv + '>' + hm[2] + '</h' + lv + '>'); bi++; continue; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushPara(); out.push('<hr>'); bi++; continue; }
      if (/^>\s?/.test(t)) { flushPara(); out.push('<blockquote>' + t.replace(/^>\s?/, '') + '</blockquote>'); bi++; continue; }
      if (/^\s*[-*+]\s+/.test(line)) {
        flushPara(); var uitems = [];
        while (bi < lines.length && /^\s*[-*+]\s+/.test(lines[bi])) { uitems.push(lines[bi].replace(/^\s*[-*+]\s+/, '')); bi++; }
        out.push('<ul>' + uitems.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>');
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(line)) {
        flushPara(); var oitems = [];
        while (bi < lines.length && /^\s*\d+[.)]\s+/.test(lines[bi])) { oitems.push(lines[bi].replace(/^\s*\d+[.)]\s+/, '')); bi++; }
        out.push('<ol>' + oitems.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>');
        continue;
      }
      if (t === '') { flushPara(); bi++; continue; }
      paraBuf.push(line); bi++;
    }
    flushPara();
    return out.join('').replace(/@@MATH(\d+)@@/g, function (m, idx) { return maths[+idx] || ''; }).replace(/@@BLOCK(\d+)@@/g, function (m, idx) { return blocks[+idx] || ''; });
  }

  // force=true 时总是滚到底；否则仅在用户仍"跟随底部"时才跟随（不打扰往上翻看）
  // pinBottom 记录用户是否跟随底部：
  //   - 用户在底部附近（含点击回到底部按钮、程序化滚动）→ true
  //   - 用户主动向上滚动离开底部 → false
  // 用状态位而非实时 isNearBottom() 判定，避免内容瞬时增长超过阈值时被误判为
  // "已离开底部"，导致刚点击回到底部后马上又弹出按钮。
  var pinBottom = true;
  // 程序化改变内容高度（如工具卡折叠）时，浏览器的 scrollTop clamp 会触发 scroll 事件，
  // 从而错误地把 pinBottom 改成 true（把正在看历史的位置拉到底）。用此标志抑制该副作用。
  var suppressPin = false;
  function isNearBottom() {
    return (stream.scrollHeight - stream.scrollTop - stream.clientHeight) < 90;
  }
  function scrollBottom(force) {
    if (force || pinBottom) {
      stream.scrollTop = stream.scrollHeight;
      pinBottom = true;
    }
    updateScrollBtn();
  }
  var scrollBtn = null;
  function updateScrollBtn() {
    if (!scrollBtn) return;
    if (pinBottom) scrollBtn.classList.remove('show');
    else scrollBtn.classList.add('show');
  }
  function clearEmpty() { if (empty && empty.parentNode) { empty.parentNode.removeChild(empty); empty = null; } }

  var progressEl = document.getElementById('progress');
  var generating = false;
  var lastActivityAt = Date.now();

  /** 对话是否在运行：模型生成中，或工具正在执行（工具执行期间任务同样没结束） */
  function isBusy() { return generating || toolRunningCount > 0; }

  // 中止抑制：锁在"任务代次"上而非墙上时间 —— 中止后迟到的旧任务事件被忽略，
  // 但用户发起新任务（或被显式认领的新一轮）会自增代次，立即恢复正常忙碌判定。
  var abortEpoch = 0;      // 每次中止自增；事件/状态先记下它属于哪一代
  var abortStamp = 0;      // 最近一次中止时的代次，事件若仍等于它则视为"上一代的尾巴"
  function markAborted() {
    toolRunningCount = 0;
    abortEpoch++;
    abortStamp = abortEpoch;
  }
  /** 主动发起新动作（发送 / 继续 / 自动续跑）：把当前代次认领为"活的"，旧尾巴不再干扰 */
  function clearAbortSuppression() { abortStamp = 0; }
  function aborted() { return abortStamp !== 0 && abortStamp === abortEpoch; }

  var lastBusyNotify = false;
  /** 按"对话在运行"统一刷新进度条 / 发送按钮 / 忙状态通知 */
  function syncBusyIndicators() {
    var busy = isBusy();
    progressEl.className = 'progress' + (busy ? ' on' : '');
    updateSendButton();
    if (busy !== lastBusyNotify) {
      lastBusyNotify = busy;
      try { if (api.setBusy) api.setBusy(busy); } catch (e) { /* ignore */ }
    }
  }

  function setStatus(text, state) {
    // 中止后、且尚未开始新任务时，忽略迟到的 busy（否则按钮会在停止后跳回停止态）
    if (state === 'busy' && aborted()) return;
    statusText.textContent = text;
    statusEl.className = 'status' + (state ? ' ' + state : '');
    generating = (state === 'busy');
    if (generating) lastActivityAt = Date.now();
    syncBusyIndicators();
  }

  // 兜底：生成中超过 12 秒无任何事件 → 重置为就绪，避免按钮卡在"停止"。
  // 工具执行中不算静默：bash / 长任务可能几十秒无事件，期间必须保持中止按钮。
  setInterval(function () {
    if (generating && toolRunningCount === 0 && Date.now() - lastActivityAt > 12000) {
      setStatus('就绪', 'ready');
      cur = null;
    }
  }, 1500);

  function updateSendButton() {
    if (isBusy()) {
      sendBtn.classList.add('stop');
      sendBtn.title = '中止（停止生成 / 工具执行）';
      sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>';
    } else {
      sendBtn.classList.remove('stop');
      sendBtn.title = '发送';
      sendBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M8 3l-4 4M8 3l4 4"/></svg>';
    }
  }

  // 给消息节点挂"复制"按钮（悬停显示）
  var COPY_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></svg>';
  function attachCopy(container, getText) {
    if (container.querySelector('.msg-copy')) return;
    var btn = document.createElement('button');
    btn.className = 'msg-copy';
    btn.innerHTML = COPY_SVG + '<span>复制</span>';
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var t = typeof getText === 'function' ? getText() : '';
      if (!t) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t);
        else {
          var ta = document.createElement('textarea');
          ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
        btn.classList.add('copied');
        btn.querySelector('span').textContent = '已复制';
        setTimeout(function () { btn.classList.remove('copied'); var s = btn.querySelector('span'); if (s) s.textContent = '复制'; }, 1500);
      } catch (err) { /* ignore */ }
    });
    container.appendChild(btn);
  }

  function addUser(text) {
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg user';
    d.innerHTML = '<div class="bubble">' + esc(text) + '</div>';
    attachCopy(d, function () { return text; });
    stream.appendChild(d);
    scrollBottom(true);
  }

  var PREFIX_SVG = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.8 4.6L14.5 8l-4.7 2.4L8 15l-1.8-4.6L1.5 8l4.7-2.4z"/></svg>';

  function createAssistant() {
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg assistant';
    d.innerHTML =
      '<div class="prefix">' + PREFIX_SVG + 'Cuckoo</div>' +
      '<div class="think" style="display:none">' +
        '<div class="think-head"><svg class="caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg><span class="think-label">思考中…</span></div>' +
        '<div class="think-body"></div>' +
      '</div>' +
      '<div class="body"></div>';
    attachCopy(d, function () { return (d.querySelector('.body') || {}).innerText || ''; });
    stream.appendChild(d);
    var thinkEl = d.querySelector('.think');
    thinkEl.querySelector('.think-head').addEventListener('click', function () { thinkEl.classList.toggle('open'); });
    return { el: d, thinkEl: thinkEl, thinkBody: d.querySelector('.think-body'), thinkLabel: d.querySelector('.think-label'), body: d.querySelector('.body') };
  }

  // 去重：已完成的回复文本（防止 finished 流事件重复触发导致重复气泡）
  var lastDoneText = '';
  // 去重：已写入历史的最新 assistant 文本
  var lastPushedAssistant = '';
  // 流式更新：think/text 均为全量快照
  function onStream(think, text, finished) {
    if (!think && !text && !finished) return; // 空心跳，忽略
    // 重复的完成事件：文本与最近一次已完成的一致 → 忽略
    if (finished && text && text.trim() === lastDoneText) return;
    if (!cur) cur = createAssistant();
    if (cur.pending && (think || text)) { cur.pending = false; }
    if (think) {
      cur.thinkEl.style.display = '';
      cur.thinkBody.textContent = think;
      cur.thinkLabel.textContent = text ? '已思考 (' + think.length + ' 字)' : '思考中…';
      // 正文尚未出现时，自动展开思考；正文出现后自动折叠
      if (!text) cur.thinkEl.classList.add('open');
      else if (cur.thinkEl.classList.contains('open') && !cur.userToggled) cur.thinkEl.classList.remove('open');
    }
    if (text) {
      cur.body.innerHTML = renderMarkdown(text) + (finished ? '' : '<span class="streaming-cursor"></span>');
    }
    scrollBottom(false); // 跟随但不打扰往上翻看
    // 注意：finished 时不置空 cur，交给 onAssistantDone 收尾（否则会重复渲染一条）
  }

  function onAssistantDone(text) {
    // 回复完成：若有工具仍在执行，任务并未结束 —— 状态与按钮都保持"运行中"
    if (toolRunningCount > 0) setStatus('工具运行中…', 'busy');
    else setStatus('就绪', 'ready');
    var t = (text || '').trim();
    // 去重：与上一条已完成一致则忽略（防 finished 流 + assistant-done 双触发）
    if (t && t === lastDoneText) { if (cur) cur = null; return; }
    if (t) lastDoneText = t;
    if (cur) {
      if (t) {
        cur.body.innerHTML = renderMarkdown(t);
      } else {
        // 纯思考/工具回合：仅收尾思考块（"思考中…" → "已思考 (N 字)"），不新增气泡
        try {
          var tl = cur.thinkBody ? cur.thinkBody.textContent : '';
          if (tl && cur.thinkLabel) cur.thinkLabel.textContent = '已思考 (' + tl.length + ' 字)';
        } catch (e) { /* ignore */ }
      }
      cur = null;
      scrollBottom(false);
      return;
    }
    if (!t) return;
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg assistant';
    d.innerHTML = '<div class="prefix">' + PREFIX_SVG + 'Cuckoo</div><div class="body">' + renderMarkdown(t) + '</div>';
    attachCopy(d, function () { return t; });
    stream.appendChild(d);
    scrollBottom();
  }

  // 从工具代码提取工具名 + 首个字符串参数（用于卡片标题，不显示原始代码）
  function parseToolCall(code) {
    var s = String(code || '');
    var KNOWN = ['readLines', 'read', 'write', 'edit', 'glob', 'grep', 'todoWrite', 'bash', 'pwsh', 'deleteFile', 'webFetch', 'mysql', 'mcpCall', 'mcpListServers', 'mcpGetTools', 'openBrowserWindow', 'injectJS', 'attachFile', 'runAgent'];
    var name = '';
    var m = /await\s+([a-zA-Z][a-zA-Z0-9_]*)\s*\(/.exec(s);
    if (m) name = m[1];
    if (!name) { for (var i = 0; i < KNOWN.length; i++) { if (s.indexOf(KNOWN[i] + '(') >= 0) { name = KNOWN[i]; break; } } }
    if (!name) name = 'tool';
    var arg = '';
    try {
      var re = new RegExp(name + '\\s*\\(\\s*([\'"\`])([\\s\\S]*?)\\1');
      var am = re.exec(s);
      if (am) arg = am[2];
    } catch (e) { /* ignore */ }
    if (arg.length > 60) arg = arg.slice(0, 60) + '…';
    return { name: name, arg: arg };
  }

  function addToolStart(code) {
    clearEmpty();
    var id = 'tool-' + (++toolSeq);
    var tc = parseToolCall(code);
    var wrap = document.createElement('div');
    wrap.className = 'tool';
    wrap.innerHTML =
      '<div class="tool-card open" id="' + id + '">' +
        '<div class="tool-head">' +
          '<span class="tool-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h4l3 3v9H3V2z"/><path d="M6 7h4M6 10h4"/></svg></span>' +
          '<span class="tool-name">' + esc(tc.name) + '</span>' +
          '<span class="tool-arg">' + esc(tc.arg) + '</span>' +
          '<span class="tool-badge run">运行中</span>' +
          '<span class="tool-caret"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span>' +
        '</div>' +
        '<div class="tool-body">' +
          '<div class="tool-sec"><div class="tool-sec-label">Code</div><pre class="tool-pre">' + esc(code) + '</pre></div>' +
          '<div class="tool-sec out-sec" style="display:none"><div class="tool-sec-label">Result</div><pre class="tool-pre out-pre"></pre></div>' +
        '</div>' +
      '</div>';
    stream.appendChild(wrap);
    wrap.querySelector('.tool-head').addEventListener('click', function () { wrap.querySelector('.tool-card').classList.toggle('open'); });
    // 尊重用户当前位置：在底部才跟随，正在翻看历史则不打扰
    scrollBottom(false);
    return id;
  }

  function addToolEnd(success, output, error) {
    // 找最近一个"运行中"的卡片（不限于 open，避免被折叠后漏匹配）
    var all = stream.querySelectorAll('.tool-card');
    var target = null;
    for (var i = all.length - 1; i >= 0; i--) {
      var b = all[i].querySelector('.tool-badge');
      if (b && b.classList.contains('run')) { target = all[i]; break; }
    }
    if (!target) return;
    var badge = target.querySelector('.tool-badge');
    badge.className = 'tool-badge ' + (success ? 'ok' : 'err');
    badge.textContent = success ? '完成' : '失败';
    var outSec = target.querySelector('.out-sec');
    var outPre = target.querySelector('.out-pre');
    if (outSec && outPre) {
      outSec.style.display = '';
      outPre.textContent = success ? (output || '(无输出)') : (error || '未知错误');
      if (!success) outPre.classList.add('err');
    }
    // 执行完成后统一自动折叠（成功/失败都折叠，用户可点击展开）
    // 关键：折叠会让内容变矮，需在抑制 pinBottom 副作用的前提下保持用户当前视图位置
    var wasPinned = pinBottom;
    var prevTop = stream.scrollTop;
    suppressPin = true;
    target.classList.remove('open');
    if (wasPinned) {
      stream.scrollTop = stream.scrollHeight;
    } else {
      // 原本不在底部 → 锁定原位置（折叠只影响下方内容高度）
      stream.scrollTop = prevTop;
    }
    // 下一帧解除抑制并校正（内容高度已稳定）；同时用 setTimeout 兜底，避免 rAF 未触发导致 suppressPin 卡死
    function settle() {
      if (wasPinned) {
        stream.scrollTop = stream.scrollHeight;
        pinBottom = true;
      } else {
        stream.scrollTop = Math.min(prevTop, Math.max(0, stream.scrollHeight - stream.clientHeight));
        pinBottom = false;
      }
      suppressPin = false;
      updateScrollBtn();
    }
    var settled = false;
    function once() { if (!settled) { settled = true; settle(); } }
    requestAnimationFrame(once);
    setTimeout(once, 60);
  }

  if (api.onEvent) {
    api.onEvent(function (payload) {
      if (!payload) return;
      lastActivityAt = Date.now();
      switch (payload.type) {
        case 'user': addUser(payload.text); break;
        case 'stream': cancelGoalNudge(); onStream(payload.think, payload.text, payload.finished); break;
        case 'assistant-done': {
          var adText = (payload.text || '').trim();
          var adThink = (cur && cur.thinkBody) ? cur.thinkBody.textContent : '';
          onAssistantDone(payload.text);
          if (adText && adText !== lastPushedAssistant) { lastPushedAssistant = adText; pushHist({ t: 'assistant', text: payload.text, think: adThink }); }
          if (goal && !goal.done && !goal.paused) checkProgress(adText);
          else if (planAutoEnabled() && planHasPending()) checkPlanProgress(adText);
          scheduleGoalNudge();
          break;
        }
        case 'plan': planBySession[currentSessionId] = payload.todos || []; renderPlan(payload.todos); pushHist({ t: 'plan', todos: payload.todos || [] }); break;
        case 'goal-done': onGoalDone(); break;
        case 'assistant': {
          var aText = (payload.text || '').trim();
          onAssistantDone(payload.text);
          if (aText && aText !== lastPushedAssistant) { lastPushedAssistant = aText; pushHist({ t: 'assistant', text: payload.text }); }
          break;
        }
        case 'tool-start': cancelGoalNudge();
          // 中止后、尚未开始新任务时到达的工具开始事件：只渲染卡片，不重新置忙
          if (!aborted()) { toolRunningCount++; syncBusyIndicators(); }
          // 工具调用开始 = 当前助手回合结束：收尾思考块并关闭当前气泡，避免"思考中…"悬留
          if (cur) { try { var tl0 = cur.thinkBody ? cur.thinkBody.textContent : ''; if (tl0 && cur.thinkLabel) cur.thinkLabel.textContent = '已思考 (' + tl0.length + ' 字)'; } catch (e) { /* ignore */ } cur = null; }
          addToolStart(payload.code); setStatus('工具运行中…', 'busy'); pushHist({ t: 'tool', code: payload.code, success: null, output: '', error: '' }); break;
        case 'tool-end': if (toolRunningCount > 0) toolRunningCount--; addToolEnd(payload.success, payload.output, payload.error); setStatus('生成中…', 'busy'); syncBusyIndicators(); {
          // 更新最近一个"未完成"的工具历史（从后往前找 success===null）
          for (var ti = history.length - 1; ti >= 0; ti--) {
            if (history[ti].t === 'tool' && history[ti].success === null) {
              history[ti].success = payload.success; history[ti].output = payload.output; history[ti].error = payload.error; saveHist(); break;
            }
          }
          break;
        }
        case 'session-changed': onSessionChanged(payload.sessionId); break;
        case 'status': setStatus(payload.text, payload.busy ? 'busy' : 'ready'); break;
      }
    });
  }

  function send() {
    var text = input.value.trim();
    var files = pendingFiles.slice();
    var hints = pendingHints.slice();
    console.log('[harness] send() 调用, text 长度=' + text.length + ', files=' + files.length + ', hints=' + hints.length);
    if (!text && files.length === 0 && hints.length === 0) return;
    clearAbortSuppression(); // 新任务：解除中止后的抑制窗口
    resetPlanDrive(); // 新任务：重置计划驱动轮数
    hideSlashMenu();
    input.value = '';
    input.style.height = 'auto';
    // 目标："/goal xxx" 或带"目标"chip（与"计划"同款）
    var displayText = text, sendText = text;
    var goalText = null;
    var hasGoalChip = false;
    for (var gi = 0; gi < hints.length; gi++) { if (hints[gi].isGoal) { hasGoalChip = true; break; } }
    if (hasGoalChip) { goalText = text; }
    else if (/^\/goal(\s|$)/.test(text)) { goalText = text.replace(/^\/goal\s*/, '').trim(); }
    if (goalText !== null) {
      if (!goalText) {
        // 无参数 = 查看当前目标（对齐 DSH 的"设置或查看"语义）
        if (goal) {
          appendSystem('当前目标：' + goal.text + '（' + (goal.done ? '已完成' : (goal.paused ? '已暂停' : '进行中')) +
            ' · 迭代 ' + goal.round + (goal.maxIterations ? '/' + goal.maxIterations : '') + ' · ' + fmtElapsed(goalElapsedMs()) + '）');
        } else {
          appendSystem('用法：/goal <目标描述> —— 设定后自动多轮推进，目标完成后自动结束；也可点「暂停」中止当前任务、点「退出」彻底停止');
        }
        input.focus();
        return;
      }
      startGoal(goalText);
      displayText = '[目标] ' + goalText;
      sendText = buildGoalSendText(goalText);
    }
    // 隐藏指令（技能/工具/计划）：附加到发给 AI 的文本，但不进对话气泡
    var hintText = hints.length ? hints.filter(function (h) { return !h.isGoal; }).map(function (h) { return h.text; }).join('\n') : '';
    if (hintText) sendText = (hintText + '\n' + sendText).trim();
    var attachNote = files.length ? ('[附件 ' + files.length + ' 个] ') : '';
    // 气泡：/goal 显示"[目标] xxx"；正常显示用户文字；仅选 chip 时显示"[指令] 标签"
    var bubbleText;
    if (displayText !== text) bubbleText = displayText;
    else if (text) bubbleText = text;
    else if (hints.length) bubbleText = '[指令] ' + hints.map(function (h) { return h.label; }).join('、');
    else bubbleText = '';
    addUser(attachNote + bubbleText);
    pushHist({ t: 'user', text: attachNote + bubbleText });
    pendingFiles = [];
    pendingHints = [];
    renderAttach();
    renderHints();
    setStatus('生成中…', 'busy');
    if (!cur) {
      cur = createAssistant();
      cur.pending = true;
      cur.body.innerHTML = '<span class="pending-dots"><i></i><i></i><i></i></span>';
      scrollBottom();
    }
    // 先上传附件，再发送消息（8 秒超时兜底，快速失败）
    if (files.length && api.attach) {
      setStatus('上传附件…', 'busy');
      var attachP = api.attach(files);
      var timeoutP = new Promise(function (resolve) {
        setTimeout(function () { resolve({ success: false, uploaded: 0, results: [{ error: '上传超时（15 秒无响应）' }] }); }, 15000);
      });
      Promise.race([attachP, timeoutP]).then(function (res) {
        var ok = res && res.uploaded ? res.uploaded : 0;
        if (ok === 0) {
          var detail = '';
          try { detail = (res && res.results && res.results[0] && res.results[0].error) || ''; } catch (e) { /* ignore */ }
          appendSystem('附件上传失败：' + (detail || '当前平台可能不支持自动上传附件'));
          pushHist({ t: 'system', text: '附件上传失败：' + (detail || '当前平台可能不支持自动上传附件') });
          setStatus('就绪', 'ready');
          cur = null;
          return;
        }
        // 上传成功：延迟发送，给 AI 网页时间把附件与"发送"绑定（否则附件带不上）
        if (api.sendMessage) {
          setStatus('发送中…', 'busy');
          setTimeout(function () { api.sendMessage(sendText || ' '); }, 1500);
        }
      }).catch(function (e) {
        appendSystem('附件上传出错：' + ((e && e.message) || '未知错误'));
        setStatus('就绪', 'ready');
        cur = null;
      });
    } else if (api.sendMessage) {
      api.sendMessage(sendText);
    }
  }

  // 追加一条系统提示（居中灰色小字）
  function appendSystem(text) {
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg system';
    d.innerHTML = '<div class="sys-text">' + esc(text) + '</div>';
    stream.appendChild(d);
    scrollBottom(true);
  }

  function stop() {
    // 立即重置本地状态（不等主进程），给用户即时反馈
    markAborted(); // 先清工具计数：否则 setStatus 后按钮仍会因"工具在跑"保持停止态
    setStatus('就绪', 'ready');
    cancelGoalNudge();
    var hadGoal = !!(goal && !goal.done);
    // 运行中按停止 = 退出目标（清掉目标条，不留半死状态）；已完成的目标条保留
    if (hadGoal) stopGoal('已停止生成，目标自动推进已一并退出（可 /goal 重新设定）');
    // 清理未完成的助手气泡（含 pending 加载动画 / 流式光标）
    clearPendingBubble();
    appendSystem('已停止生成');
    pushHist({ t: 'system', text: '已停止生成' });
    // 后台请求停止 AI 页面（失败也无妨）
    if (api.stop) { try { api.stop().catch(function () { /* ignore */ }); } catch (e) { /* ignore */ } }
  }

  sendBtn.addEventListener('click', function () {
    console.log('[harness] send 按钮点击, busy=' + isBusy() + ', api.sendMessage=' + (typeof api.sendMessage));
    if (isBusy()) stop(); else send();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hideSlashMenu(); return; }
    if (slashMenu.classList.contains('show')) {
      var items = slashMenu.querySelectorAll('.slash-item');
      if (e.key === 'ArrowDown' && items.length) {
        e.preventDefault();
        slashIndex = (slashIndex + 1) % items.length;
        updateSlashActive();
        return;
      }
      if (e.key === 'ArrowUp' && items.length) {
        e.preventDefault();
        slashIndex = (slashIndex - 1 + items.length) % items.length;
        updateSlashActive();
        return;
      }
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        if (items[slashIndex]) { e.preventDefault(); items[slashIndex].click(); return; }
        hideSlashMenu(); // 无可选项：收起菜单，走正常发送
      }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (isBusy()) return; // 生成中/工具执行中：忽略 Enter，避免重复发送（可用中止按钮）
      send();
    }
  });
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    var v = input.value;
    if (v.length > 0 && v.charAt(v.length - 1) === '/') { openSlashMenu(); return; }
    // 菜单已打开且正在输入过滤词（"/" 后跟非空白字符）
    var m = /(?:^|\s)\/([^\/\s]*)$/.exec(v);
    if (slashMenu.classList.contains('show') && m) { filterSlashMenu(m[1]); return; }
    hideSlashMenu();
  });

  // ===== 附件（图片/文件）=====

  var attachBtn = document.getElementById('attach-btn');

  var dropOverlay = document.getElementById('drop-overlay');

  var pendingFiles = []; // { name, mime, size, data(base64) }
  // 待发隐藏指令（技能/工具/计划等）：只显示为 chip，发送时作为隐藏文本附加给 AI，不进对话气泡
  var pendingHints = []; // { label, text }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function fileIcon(mime) {
    var isImg = (mime || '').indexOf('image/') === 0;
    if (isImg) return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="5.5" cy="6.5" r="1.2"/><path d="M2 11l3.5-3 3 2.5L11 8l3 3"/></svg>';
    return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h4l3 3v9H3V2z"/><path d="M6 7h4M6 10h4"/></svg>';

  function renderAttach() {

        chip.querySelector('.ac-del').addEventListener('click', function () { pendingFiles.splice(idx, 1); renderAttach(); });
